[package]
name = "mobile_tlsn_verifier_service"
version = "0.1.0"
edition = "2021"
description = "Standalone verifier/notary service for mobile_tlsn_plugin"
license = "MIT"

[[bin]]
name = "mobile-tlsn-verifier-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "json"] }
base64 = "0.22"
bincode = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
eyre = "0.6"
futures-util = "0.3"
rangeset = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Use upstream TLSN stack pinned to alpha.14 tag.
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.14" }
