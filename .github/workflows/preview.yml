name: Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Generate Worker types
        run: npm run types
        working-directory: worker
      - name: Type-check Worker
        run: npm run check
        working-directory: worker
      - name: Test Rust service
        run: cargo test --locked

  preview:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.extract-url.outputs.deployment-url }}
    outputs:
      deployment-url: ${{ steps.extract-url.outputs.deployment-url }}
      version-id: ${{ steps.extract-url.outputs.version-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Upload preview Worker version
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            versions upload
            --preview-alias pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          workingDirectory: worker
      - name: Extract deployment URL
        id: extract-url
        env:
          OUTPUT: ${{ steps.preview.outputs.command-output }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MESSAGE: "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
        run: |
          WORKER_NAME="mpc-verifier"
          WORKERS_SUBDOMAIN="burnt"
          PREVIEW_ALIAS="pr-${PR_NUMBER}"

          VERSION_ID=$(echo "$OUTPUT" | grep -oE 'Worker Version ID: [a-f0-9-]+' | cut -d' ' -f4 | head -1 || true)
          URL=$(echo "$OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' | head -1 || true)

          if [ -z "$URL" ] && [ -n "$VERSION_ID" ]; then
            SHORT_VERSION_ID=$(echo "$VERSION_ID" | cut -d'-' -f1)
            URL="https://${SHORT_VERSION_ID}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev/docs"
          fi

          if [ -z "$URL" ]; then
            URL="https://${PREVIEW_ALIAS}-${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev/docs"
          fi

          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "version-id=${VERSION_ID:-unknown}" >> "$GITHUB_OUTPUT"

          echo "### Preview deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Message:** $MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** preview" >> "$GITHUB_STEP_SUMMARY"
          echo "**Worker:** $WORKER_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version ID:** ${VERSION_ID:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.extract-url.outputs.deployment-url }}
          VERSION_ID: ${{ steps.extract-url.outputs.version-id }}
          MESSAGE: "PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const versionId = process.env.VERSION_ID;
            const message = process.env.MESSAGE;
            const sha = context.sha.substring(0, 7);
            const now = new Date().toISOString().replace('T', ' ').substring(0, 16) + ' UTC';
            const repoUrl = context.payload.repository.html_url;
            const marker = 'Deploying with Cloudflare Workers (preview)';

            const body = [
              `## ${marker}`,
              '',
              `**${message}**`,
              '',
              '| Status | Name | Latest Commit | Version | Updated (UTC) |',
              '|--------|------|---------------|---------|---------------|',
              `| Preview ready<br>[View preview](${url}) | mpc-verifier | [${sha}](${repoUrl}/commit/${context.sha}) | ${versionId} | ${now} |`,
              '',
              'Note: preview URLs may be protected by Cloudflare Access.'
            ].join('\n');

            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.info('No PR context; skipping preview comment');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(comment => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
