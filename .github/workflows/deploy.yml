name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Generate Worker types
        run: npm run types
        working-directory: worker
      - name: Type-check Worker
        run: npm run check
        working-directory: worker
      - name: Test Rust service
        run: cargo test --locked

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mpc-verifier.burnt.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: npm
          workingDirectory: worker
